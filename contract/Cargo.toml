[package]
name = "lifemarq-contract"
version = "0.1.0"
edition = "2021"
authors = ["Lifemarq Contributors"]
description = "Immutable organ donor registry on Stellar Soroban"
license = "MIT"
repository = "https://github.com/Just-Bamford/lifemarq"

[dependencies]
soroban-sdk = "21.4"
soroban-sdk-macros = "21.4"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
